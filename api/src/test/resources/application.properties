# Flyway 마이그레이션이 실제 MySQL 문법(AUTO_INCREMENT, ON UPDATE CURRENT_TIMESTAMP 등)을 쓰므로,
# 테스트용 임베디드 H2도 MySQL 호환 모드로 띄워야 같은 마이그레이션 파일을 그대로 적용할 수 있다.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 2026-08-24 실측: SlackNotifier가 @Component로 무조건 생성되는데(app.consistency-verification.enabled
# 조건과 무관), 이 값이 없으면 PlaceholderResolutionException으로 @SpringBootTest 전체가 컨텍스트
# 로딩부터 실패한다 - 운영 배포 때 겪었던 것과 같은 문제가 테스트에도 그대로 있었음(StockLossRepairJob
# 추가 전까지는 아무도 이 pull 이후 @SpringBootTest를 실행해본 적이 없어서 못 잡혔던 것으로 보임).
# 실제로 Slack에 전송되는 테스트는 없으므로 더미 값으로 충분하다.
slack.consistency-webhook-url=https://hooks.slack.com/services/test

# 2026-08-26 실측: 위와 같은 이유로 NotionReportGenerator도 @Component라 무조건 생성되는데,
# fix/verification PR(#162)이 notion.api.token/notion.database-id를 추가하면서 여기엔 안
# 넣어둬서 @SpringBootTest 컨텍스트 로딩이 다시 막혔다(StockLossRepairJobTest가 이 조합을
# 처음 실행해봐서 드러남). 실제로 Notion에 전송되는 테스트는 없으므로 더미 값으로 충분하다.
notion.api.token=test-notion-token
notion.database-id=test-notion-database-id

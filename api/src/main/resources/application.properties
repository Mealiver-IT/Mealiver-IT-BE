spring.application.name=MealiverItBe

management.endpoints.web.exposure.include=health,prometheus

# 08_개발표준.txt: 운영 스키마는 항상 Flyway로 관리, Hibernate는 검증만 수행
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false

# 2026-08-19 부하테스트(coupon_mixed_5k_x4.js, 캠페인 20,000건 순간 동시요청)에서
# HikariCP 기본 풀 크기(10)로 인해 connection refused/timeout 다발 확인(Prometheus
# hikaricp_connections_pending 최대 190). 동시성 통합테스트(CouponIssueServiceConcurrencyTest 등)에서
# 이미 검증된 값을 실배포 설정에도 반영. application-remote.properties가 아니라 여기 두는 이유:
# docker-compose의 api 서비스가 SPRING_PROFILES_ACTIVE를 설정하지 않아 remote 프로파일이
# 실제로는 활성화되지 않으므로, 프로파일 무관하게 항상 로드되는 이 파일에 둬야 실배포에 반영됨.
spring.datasource.hikari.maximum-pool-size=110
spring.datasource.hikari.connection-timeout=60000
spring.application.name=MealiverItBe

management.endpoints.web.exposure.include=health,prometheus

# 08_개발표준.txt: 운영 스키마는 항상 Flyway로 관리, Hibernate는 검증만 수행
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false

# 2026-08-19 부하테스트(coupon_mixed_5k_x4.js, 캠페인 20,000건 순간 동시요청)에서
# HikariCP 기본 풀 크기(10)로 인해 connection refused/timeout 다발 확인(Prometheus
# hikaricp_connections_pending 최대 190). 동시성 통합테스트(CouponIssueServiceConcurrencyTest 등)에서
# 이미 검증된 값을 실배포 설정에도 반영. application-remote.properties가 아니라 여기 두는 이유:
# docker-compose의 api 서비스가 SPRING_PROFILES_ACTIVE를 설정하지 않아 remote 프로파일이
# 실제로는 활성화되지 않으므로, 프로파일 무관하게 항상 로드되는 이 파일에 둬야 실배포에 반영됨.
#
# 2026-08-20 재고 샤딩(#100)/Tomcat 상향(#94) 배포 후 재측정(16:36~17:51 KST)에서 110으로도
# 여전히 부족함을 확인 - hikaricp_connections_pending이 최대 286까지 찍히고 active는 110(풀
# 전체)에서 고정됨(Prometheus 실측). 110→300으로 상향한 근거: Tomcat threads.max(300)가 동기
# 요청 경로에서 커넥션을 요구할 수 있는 이론적 상한이라, 임의로 늘리는 게 아니라 이 시스템이
# 실제로 만들어낼 수 있는 최대 동시 수요에 맞춘 값. MySQL max_connections도 300 -> 400으로
# 같이 상향해야 함(Mealiver-IT-Infra/docker-compose.yml).
#
# minimum-idle을 안 정하면 HikariCP 기본 동작상 maximum-pool-size와 같은 값으로 고정된다 -
# 즉 트래픽이 없어도 항상 300개 커넥션을 열어둔 채였다(부하테스트 담당자가 Adminer
# "Too many connections" 사고로 실측 - MySQL max_connections=400 중 300을 상시 점유해
# 평상시에도 여유가 100뿐이었음). 평소엔 낮게 유지하다 트래픽 몰릴 때만 300까지 늘어나도록
# 최소 유휴 커넥션 수를 별도로 낮게 잡는다.
spring.datasource.hikari.maximum-pool-size=300
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.connection-timeout=60000

# 2026-08-20 부하테스트(coupon_mixed_5k_x4.js, VU 20,000 순간 동시접속)에서 "예상 밖 응답"
# 13,554건 중 11,708건(58.5%)이 DB/락과 무관한 순수 TCP connection refused였음 - Tomcat NIO
# 커넥터 기본값(max-connections=8192, accept-count=100 백로그) 합계를 순간적으로 크게 초과해서
# 커넥션 자체가 수락 단계에서 거부됨(테스트 시작 직후 1~2초 안에 전부 발생, 20000-8292≈11708로
# 수치도 거의 일치). HikariCP 풀 크기와 마찬가지로 관측된 피크 동시접속(20,000)을 기준으로 상향.
server.tomcat.max-connections=20000
server.tomcat.accept-count=5000
server.tomcat.threads.max=300

# ConsistencyVerificationJob(Spring Batch)이 spring-boot-starter-batch의 기본값(JobLauncherApplicationRunner)
# 때문에 앱이 뜰 때마다 자동 실행되고 있었음 - 정합성 검증은 온디맨드/스케줄 실행이 맞고 매 기동마다
# 도는 건 의도가 아님. 실패 시(2026-08-19 확인: MySQL 시퀀스 증분기 오류) 컨텍스트 로딩 자체가
# 깨져서 배치와 무관한 테스트/실배포까지 전부 영향을 받는다. 잡 빈은 그대로 두고 자동 실행만 끈다 -
# 수동 트리거(관리자 API/스케줄러)는 별도 구현 필요.
spring.batch.job.enabled=false